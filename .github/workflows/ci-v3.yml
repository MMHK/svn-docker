name: CI v3

# API（Go）與前端（rspack + Vue 3）的建置與測試。
#
# 刻意**不**包含端到端驗證（test/verify-v2.sh）：它需要 Docker daemon、
# 兩個已建置的映像與 docker compose，且會起 / 停容器；改由發行前在本機執行。
on:
  push:
    branches: [master]
    paths:
      - 'api/**'
      - 'web/**'
      - '.github/workflows/ci-v3.yml'
  pull_request:
    paths:
      - 'api/**'
      - 'web/**'
      - '.github/workflows/ci-v3.yml'

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum

      - name: gofmt
        run: test -z "$(gofmt -l .)"

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test -race
        run: go test -race ./...

      - name: presenter layering
        run: make layers

      - name: swag is in sync with annotations
        run: |
          make swag
          git diff --exit-code -- pkg/docs

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: enable yarn 4 (packageManager)
        run: corepack enable

      - name: yarn install
        run: yarn install --immutable

      - name: typecheck
        run: yarn typecheck

      - name: yarn build
        run: yarn build
