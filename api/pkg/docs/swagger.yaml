      - users
  /svnadmin/api/v1/users/{name}/groups:
    get:
      parameters:
      - description: account name
        in: path
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_mmhk_svn-admin_pkg_view.UserGroups'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_mmhk_svn-admin_pkg_view.ErrorEnvelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/github_com_mmhk_svn-admin_pkg_view.ErrorEnvelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_mmhk_svn-admin_pkg_view.ErrorEnvelope'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/github_com_mmhk_svn-admin_pkg_view.ErrorEnvelope'
      security:
      - bearerAuth: []
      summary: Read the authz groups of an account
      tags:
      - users
    put:
      consumes:
      - application/json
      description: Edits only the necessary `[groups]` lines of the authz file. Every
        submitted group must already exist; unknown groups are rejected with 422.
      parameters:
      - description: account name
        in: path
        name: name
        required: true
        type: string
      - description: complete group list
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_mmhk_svn-admin_pkg_view.UserGroupsRequest'
      - description: sha256 of the authz file the edit is based on
        in: header
        name: If-Match
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_mmhk_svn-admin_pkg_view.UserGroups'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_mmhk_svn-admin_pkg_view.ErrorEnvelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/github_com_mmhk_svn-admin_pkg_view.ErrorEnvelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_mmhk_svn-admin_pkg_view.ErrorEnvelope'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/github_com_mmhk_svn-admin_pkg_view.ErrorEnvelope'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/github_com_mmhk_svn-admin_pkg_view.ErrorEnvelope'
      security:
      - bearerAuth: []
      summary: Replace the group membership of an account
      tags:
      - users
  /svnadmin/api/v1/users/{name}/password:
    put:
      consumes:
      - application/json
      description: Rewrites only the target htpasswd line with a fresh APR1 hash and
        revokes every token of that account, including the caller's own token when
        they rotate their own password. Every authenticated operator may change any
        account password.
      parameters:
      - description: account name
        in: path
        name: name
        required: true
        type: string
      - description: new password
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_mmhk_svn-admin_pkg_view.ChangePasswordRequest'
      - description: sha256 of the credentials file the edit is based on
        in: header
        name: If-Match
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_mmhk_svn-admin_pkg_view.ErrorEnvelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/github_com_mmhk_svn-admin_pkg_view.ErrorEnvelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_mmhk_svn-admin_pkg_view.ErrorEnvelope'
        "409":
          description: the file changed since it was read
          schema:
            $ref: '#/definitions/github_com_mmhk_svn-admin_pkg_view.ErrorEnvelope'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/github_com_mmhk_svn-admin_pkg_view.ErrorEnvelope'
        "503":
          description: setup_required
          schema:
            $ref: '#/definitions/github_com_mmhk_svn-admin_pkg_view.ErrorEnvelope'
      security:
      - bearerAuth: []
      summary: Change an account password
      tags:
      - users
securityDefinitions:
  bearerAuth:
    description: Bearer session token returned by POST /svnadmin/api/v1/session, e.g.
      "Bearer svna_...".
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
