      tags:
      - repositories
  /svnadmin/api/v1/session:
    delete:
      description: Revokes the bearer token. The call is idempotent and returns 204
        with no body.
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_mmhk_svn-admin_pkg_view.ErrorEnvelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/github_com_mmhk_svn-admin_pkg_view.ErrorEnvelope'
      security:
      - bearerAuth: []
      summary: Revoke the current session
      tags:
      - session
    get:
      description: Returns the authenticated user. The token itself is never echoed
        back.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_mmhk_svn-admin_pkg_view.Session'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_mmhk_svn-admin_pkg_view.ErrorEnvelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/github_com_mmhk_svn-admin_pkg_view.ErrorEnvelope'
      security:
      - bearerAuth: []
      summary: Describe the current session
      tags:
      - session
    post:
      consumes:
      - application/json
      description: Verifies the htpasswd credentials and returns an opaque bearer
        token. Only the single account recorded in the administrator file may sign
        in; other valid accounts receive 403 not_administrator. The token is only
        returned here and by POST /session/refresh; it is never set as a cookie. Five
        attempts per minute per client IP are allowed.
      parameters:
      - description: username and password
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_mmhk_svn-admin_pkg_view.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_mmhk_svn-admin_pkg_view.Session'
        "401":
          description: invalid credentials
          schema:
            $ref: '#/definitions/github_com_mmhk_svn-admin_pkg_view.ErrorEnvelope'
        "403":
          description: 'not_administrator: valid credentials but not the administrator,
            or the source address is not allowed'
          schema:
            $ref: '#/definitions/github_com_mmhk_svn-admin_pkg_view.ErrorEnvelope'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/github_com_mmhk_svn-admin_pkg_view.ErrorEnvelope'
        "429":
          description: too many login attempts
          schema:
            $ref: '#/definitions/github_com_mmhk_svn-admin_pkg_view.ErrorEnvelope'
        "503":
          description: 'setup_required: no administrator has been recorded yet'
          schema:
            $ref: '#/definitions/github_com_mmhk_svn-admin_pkg_view.ErrorEnvelope'
      summary: Create a session
      tags:
      - session
  /svnadmin/api/v1/session/refresh:
    post:
      description: Issues a new token and revokes the presented one immediately, so
        the old token can never be used again. The account must still be the administrator;
        otherwise the new token is revoked and the call returns 403 not_administrator.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_mmhk_svn-admin_pkg_view.Session'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_mmhk_svn-admin_pkg_view.ErrorEnvelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/github_com_mmhk_svn-admin_pkg_view.ErrorEnvelope'
      security:
      - bearerAuth: []
      summary: Rotate the session token
      tags:
      - session
  /svnadmin/api/v1/setup/admin:
    post:
      consumes:
      - application/json
      description: Requires the one-time bootstrap token from SVN_ADMIN_BOOTSTRAP_TOKEN
        (or the token printed to stderr at startup). The chosen account is written
        to the single-line administrator file and becomes the only account allowed
        to sign in to the management API. When the account does not exist yet a password
        is required and the account is created; when it exists the password is ignored.
        On a fresh deployment the marker is overwritten; once the marker exists, moving
        the administrator is a manual file edit. Missing auth/access/admin files are
        created. Other API routes answer 503 setup_required until this succeeds.
      parameters:
      - description: account name, optional password and bootstrap token
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_mmhk_svn-admin_pkg_view.SetupRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_mmhk_svn-admin_pkg_view.SetupResult'
        "403":
          description: invalid bootstrap token
          schema:
            $ref: '#/definitions/github_com_mmhk_svn-admin_pkg_view.ErrorEnvelope'
        "409":
          description: an administrator already exists
          schema:
            $ref: '#/definitions/github_com_mmhk_svn-admin_pkg_view.ErrorEnvelope'
        "422":
          description: invalid account name or missing/invalid password
          schema:
            $ref: '#/definitions/github_com_mmhk_svn-admin_pkg_view.ErrorEnvelope'
        "500":
          description: the write failed; a freshly created account is rolled back
          schema:
            $ref: '#/definitions/github_com_mmhk_svn-admin_pkg_view.ErrorEnvelope'
        "503":
          description: 'storage_unavailable: the auth/access/admin directory is missing
            or not writable'
          schema:
            $ref: '#/definitions/github_com_mmhk_svn-admin_pkg_view.ErrorEnvelope'
      summary: Create the first administrator
      tags:
      - setup
  /svnadmin/api/v1/setup/status:
    get:
      description: Public diagnostic used by the login page. It reports whether the
        single administrator still has to be created, why (missing_auth_file, missing_access_file,
        no_users, no_admin), and whether the auth/access/admin files are usable. It
        never exposes absolute paths, password hashes, file contents or the administrator
        account name. The users list is only populated while setup is pending.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_mmhk_svn-admin_pkg_view.SetupStatus'
      summary: Report the first-run setup state
      tags:
      - setup
  /svnadmin/api/v1/system/info:
    get:
      description: Service version, Go runtime and the state of the configured SVN
        paths. File contents are never returned. Requires a valid bearer token.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_mmhk_svn-admin_pkg_view.SystemInfo'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_mmhk_svn-admin_pkg_view.ErrorEnvelope'
        "403":
          description: source address is not allowed
          schema:
            $ref: '#/definitions/github_com_mmhk_svn-admin_pkg_view.ErrorEnvelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_mmhk_svn-admin_pkg_view.ErrorEnvelope'
        "503":
          description: setup_required
          schema:
