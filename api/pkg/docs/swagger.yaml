      - repositories
  /svnadmin/api/v1/repos/{repo}:
    delete:
      description: Moves the repository into SVN_ADMIN_TRASH_DIR (default `<data>/trash`)
        as `<repo>-<UTC20060102T150405Z>`; never removes data recursively. The caller
        must repeat the repository name in `confirm`. Cross-filesystem moves are refused
        with 409 and need a manual move. Deletion is enabled by default and disabled
        with SVN_ADMIN_REPO_DELETE_ENABLED=false.
      parameters:
      - description: repository name
        in: path
        name: repo
        required: true
        type: string
      - description: must equal the repository name
        in: query
        name: confirm
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_mmhk_svn-admin_pkg_view.ErrorEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_mmhk_svn-admin_pkg_view.ErrorEnvelope'
        "403":
          description: deletion is disabled
          schema:
            $ref: '#/definitions/github_com_mmhk_svn-admin_pkg_view.ErrorEnvelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_mmhk_svn-admin_pkg_view.ErrorEnvelope'
        "409":
          description: the repository is on another filesystem than the trash directory
          schema:
            $ref: '#/definitions/github_com_mmhk_svn-admin_pkg_view.ErrorEnvelope'
        "422":
          description: confirm does not match the repository name
          schema:
            $ref: '#/definitions/github_com_mmhk_svn-admin_pkg_view.ErrorEnvelope'
        "503":
          description: setup_required
          schema:
            $ref: '#/definitions/github_com_mmhk_svn-admin_pkg_view.ErrorEnvelope'
      security:
      - bearerAuth: []
      summary: Delete a repository
      tags:
      - repositories
