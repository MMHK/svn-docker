info:
  contact: {}
  description: |-
    SVN administration API. The service is reachable only from RFC1918 networks and, from P1, requires a bearer session token.
    Error responses always use {"error":{"code":"...","message":"..."}}.
  title: SVN Admin API
  version: 3.0.0-dev
paths:
  /healthz:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_mmhk_svn-admin_pkg_view.Health'
      summary: Liveness probe
      tags:
      - system
  /readyz:
    get:
      description: Checks that the SVN parent directory is usable and the auth/access
        files exist.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_mmhk_svn-admin_pkg_view.Readiness'
        "503":
          description: one or more checks failed
          schema:
            $ref: '#/definitions/github_com_mmhk_svn-admin_pkg_view.Readiness'
      summary: Readiness probe
      tags:
      - system
  /svnadmin/api/v1/access-paths:
    get:
      description: Every non-groups section of the authz file, with its ACL. Principals
        are returned verbatim so $authenticated, $anonymous and &aliases stay visible.
      parameters:
      - description: case-insensitive path filter
        in: query
        name: q
        type: string
      - description: page number (default 1)
        in: query
        name: page
        type: integer
      - description: page size (default 50, max 500)
        in: query
        name: size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_mmhk_svn-admin_pkg_view.AccessPathList'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_mmhk_svn-admin_pkg_view.ErrorEnvelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/github_com_mmhk_svn-admin_pkg_view.ErrorEnvelope'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/github_com_mmhk_svn-admin_pkg_view.ErrorEnvelope'
        "503":
          description: setup_required
          schema:
            $ref: '#/definitions/github_com_mmhk_svn-admin_pkg_view.ErrorEnvelope'
      security:
      - bearerAuth: []
      summary: List access paths
      tags:
      - access-paths
    post:
      consumes:
      - application/json
      description: Appends a `<repo>:/<path>` section. The path must match ^[A-Za-z0-9_-]{1,64}:/.*$
        and must not contain '..', NUL, a control character or a backslash.
      parameters:
      - description: new access path
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_mmhk_svn-admin_pkg_view.CreateAccessPathRequest'
      - description: sha256 of the authz file the edit is based on
        in: header
        name: If-Match
        type: string
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_mmhk_svn-admin_pkg_view.AccessPath'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_mmhk_svn-admin_pkg_view.ErrorEnvelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/github_com_mmhk_svn-admin_pkg_view.ErrorEnvelope'
        "409":
          description: the path already exists or the file changed
          schema:
            $ref: '#/definitions/github_com_mmhk_svn-admin_pkg_view.ErrorEnvelope'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/github_com_mmhk_svn-admin_pkg_view.ErrorEnvelope'
        "503":
          description: setup_required
          schema:
            $ref: '#/definitions/github_com_mmhk_svn-admin_pkg_view.ErrorEnvelope'
      security:
      - bearerAuth: []
      summary: Create an access path
      tags:
      - access-paths
  /svnadmin/api/v1/access-paths/{path}:
    delete:
      description: Removes the section and every ACL entry in it.
      parameters:
      - description: URL-safe base64 of <repo>:/<path>
        in: path
        name: path
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_mmhk_svn-admin_pkg_view.ErrorEnvelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/github_com_mmhk_svn-admin_pkg_view.ErrorEnvelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_mmhk_svn-admin_pkg_view.ErrorEnvelope'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/github_com_mmhk_svn-admin_pkg_view.ErrorEnvelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_mmhk_svn-admin_pkg_view.ErrorEnvelope'
        "503":
          description: setup_required
          schema:
            $ref: '#/definitions/github_com_mmhk_svn-admin_pkg_view.ErrorEnvelope'
      security:
      - bearerAuth: []
      summary: Delete an access path
      tags:
      - access-paths
  /svnadmin/api/v1/access-paths/{path}/acl:
    get:
      description: The path segment is the URL-safe base64 encoding of values such
        as project:/trunk; ?path= is accepted instead.
      parameters:
      - description: URL-safe base64 of <repo>:/<path>
        in: path
        name: path
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_mmhk_svn-admin_pkg_view.AccessPath'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_mmhk_svn-admin_pkg_view.ErrorEnvelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/github_com_mmhk_svn-admin_pkg_view.ErrorEnvelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_mmhk_svn-admin_pkg_view.ErrorEnvelope'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/github_com_mmhk_svn-admin_pkg_view.ErrorEnvelope'
        "503":
          description: setup_required
          schema:
            $ref: '#/definitions/github_com_mmhk_svn-admin_pkg_view.ErrorEnvelope'
      security:
      - bearerAuth: []
      summary: Get one access path ACL
      tags:
      - access-paths
  /svnadmin/api/v1/access-paths/{path}/acl/{principal}:
    delete:
      description: Deletes every line for the principal. Removing an entry that is
        already absent is a no-op. Read-only principals are rejected with 422.
      parameters:
      - description: URL-safe base64 of <repo>:/<path>
        in: path
        name: path
        required: true
        type: string
      - description: user name, @group or *
        in: path
        name: principal
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_mmhk_svn-admin_pkg_view.ErrorEnvelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/github_com_mmhk_svn-admin_pkg_view.ErrorEnvelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_mmhk_svn-admin_pkg_view.ErrorEnvelope'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/github_com_mmhk_svn-admin_pkg_view.ErrorEnvelope'
        "503":
          description: setup_required
          schema:
            $ref: '#/definitions/github_com_mmhk_svn-admin_pkg_view.ErrorEnvelope'
      security:
      - bearerAuth: []
      summary: Remove one ACL entry
      tags:
      - access-paths
    put:
      consumes:
      - application/json
      description: Writes `principal = permission` for a user, an @group or `*`. The
        permission is none, r or rw; none removes the line. $authenticated, $anonymous
        and &aliases are read-only and rejected with 422.
      parameters:
      - description: URL-safe base64 of <repo>:/<path>
        in: path
        name: path
        required: true
        type: string
      - description: user name, @group or *
        in: path
        name: principal
        required: true
        type: string
      - description: permission
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_mmhk_svn-admin_pkg_view.SetACLPermissionRequest'
      - description: sha256 of the authz file the edit is based on
        in: header
        name: If-Match
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_mmhk_svn-admin_pkg_view.AccessPath'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_mmhk_svn-admin_pkg_view.ErrorEnvelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/github_com_mmhk_svn-admin_pkg_view.ErrorEnvelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_mmhk_svn-admin_pkg_view.ErrorEnvelope'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/github_com_mmhk_svn-admin_pkg_view.ErrorEnvelope'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/github_com_mmhk_svn-admin_pkg_view.ErrorEnvelope'
        "503":
          description: setup_required
          schema:
            $ref: '#/definitions/github_com_mmhk_svn-admin_pkg_view.ErrorEnvelope'
      security:
      - bearerAuth: []
      summary: Set one ACL entry
      tags:
      - access-paths
  /svnadmin/api/v1/groups:
    get:
      parameters:
      - description: case-insensitive name filter
        in: query
        name: q
        type: string
      - description: page number (default 1)
        in: query
        name: page
        type: integer
      - description: page size (default 50, max 500)
        in: query
        name: size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_mmhk_svn-admin_pkg_view.GroupList'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_mmhk_svn-admin_pkg_view.ErrorEnvelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/github_com_mmhk_svn-admin_pkg_view.ErrorEnvelope'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/github_com_mmhk_svn-admin_pkg_view.ErrorEnvelope'
