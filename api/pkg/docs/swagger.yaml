      tags:
      - system
  /svnadmin/api/v1/users:
    get:
      description: Paged list of htpasswd accounts with their groups. Password hashes
        are never returned.
      parameters:
      - description: case-insensitive name filter
        in: query
        name: q
        type: string
      - description: page number (default 1)
        in: query
        name: page
        type: integer
      - description: page size (default 50, max 500)
        in: query
        name: size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_mmhk_svn-admin_pkg_view.UserList'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_mmhk_svn-admin_pkg_view.ErrorEnvelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/github_com_mmhk_svn-admin_pkg_view.ErrorEnvelope'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/github_com_mmhk_svn-admin_pkg_view.ErrorEnvelope'
        "503":
          description: setup_required
          schema:
            $ref: '#/definitions/github_com_mmhk_svn-admin_pkg_view.ErrorEnvelope'
      security:
      - bearerAuth: []
      summary: List SVN accounts
      tags:
      - users
    post:
      consumes:
      - application/json
      description: Adds a `user:$apr1$...` line to the htpasswd file without disturbing
        any other line. The password is hashed inside the store and never returned
        or logged.
      parameters:
      - description: new account
        in: body
