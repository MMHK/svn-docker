        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/github_com_mmhk_svn-admin_pkg_view.ErrorEnvelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_mmhk_svn-admin_pkg_view.ErrorEnvelope'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/github_com_mmhk_svn-admin_pkg_view.ErrorEnvelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_mmhk_svn-admin_pkg_view.ErrorEnvelope'
        "501":
          description: the Subversion CLI is not configured in this deployment
          schema:
            $ref: '#/definitions/github_com_mmhk_svn-admin_pkg_view.ErrorEnvelope'
        "503":
          description: setup_required
          schema:
            $ref: '#/definitions/github_com_mmhk_svn-admin_pkg_view.ErrorEnvelope'
      security:
      - bearerAuth: []
      summary: Repository information
      tags:
      - repositories
  /svnadmin/api/v1/repos/{repo}/tree:
    get:
      description: Runs `svn list --xml` and returns one page of entries. `path` must
        be relative and must not contain '.' or '..' segments; `rev` is a positive
        revision number, empty means HEAD. Entries are sorted by name before paging
        (default 100, max 1000). Subversion stderr and filesystem paths are never
        returned.
      parameters:
      - description: repository name
        in: path
        name: repo
        required: true
        type: string
      - description: relative directory path; empty means the repository root
        in: query
        name: path
        type: string
      - description: revision; empty means HEAD
        in: query
        name: rev
        type: integer
      - description: page number (default 1)
        in: query
        name: page
        type: integer
      - description: page size (default 100, max 1000)
        in: query
        name: size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_mmhk_svn-admin_pkg_view.RepositoryTree'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_mmhk_svn-admin_pkg_view.ErrorEnvelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/github_com_mmhk_svn-admin_pkg_view.ErrorEnvelope'
        "404":
          description: repository or path not found
          schema:
            $ref: '#/definitions/github_com_mmhk_svn-admin_pkg_view.ErrorEnvelope'
        "422":
