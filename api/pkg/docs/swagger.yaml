            $ref: '#/definitions/github_com_mmhk_svn-admin_pkg_view.ErrorEnvelope'
        "503":
          description: setup_required
          schema:
            $ref: '#/definitions/github_com_mmhk_svn-admin_pkg_view.ErrorEnvelope'
      security:
      - bearerAuth: []
      summary: Create an SVN account
      tags:
      - users
  /svnadmin/api/v1/users/{name}:
    delete:
      description: Removes the account from every authz group, every access-path ACL
        and finally the htpasswd file. The steps run in that order; a failure returns
        500 with the steps that already completed. `*` is rejected.
      parameters:
      - description: account name
        in: path
        name: name
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_mmhk_svn-admin_pkg_view.ErrorEnvelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/github_com_mmhk_svn-admin_pkg_view.ErrorEnvelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_mmhk_svn-admin_pkg_view.ErrorEnvelope'
        "422":
          description: invalid name such as *
          schema:
            $ref: '#/definitions/github_com_mmhk_svn-admin_pkg_view.ErrorEnvelope'
        "500":
          description: multi-step delete failed
          schema:
            $ref: '#/definitions/github_com_mmhk_svn-admin_pkg_view.ErrorEnvelope'
        "503":
          description: setup_required
          schema:
            $ref: '#/definitions/github_com_mmhk_svn-admin_pkg_view.ErrorEnvelope'
      security:
      - bearerAuth: []
      summary: Delete an SVN account
      tags:
      - users
    get:
      parameters:
      - description: account name
        in: path
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_mmhk_svn-admin_pkg_view.User'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_mmhk_svn-admin_pkg_view.ErrorEnvelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/github_com_mmhk_svn-admin_pkg_view.ErrorEnvelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_mmhk_svn-admin_pkg_view.ErrorEnvelope'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/github_com_mmhk_svn-admin_pkg_view.ErrorEnvelope'
        "503":
          description: setup_required
          schema:
            $ref: '#/definitions/github_com_mmhk_svn-admin_pkg_view.ErrorEnvelope'
      security:
      - bearerAuth: []
      summary: Get one SVN account
      tags:
      - users
  /svnadmin/api/v1/users/{name}/access-paths:
    get:
      description: 'Returns every source of access: direct user entries, entries inherited
        through the account''s groups and the global `*` entry. inherited is true
        for the last two; source is user, group or global.'
      parameters:
      - description: account name
        in: path
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_mmhk_svn-admin_pkg_view.UserAccessPaths'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_mmhk_svn-admin_pkg_view.ErrorEnvelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/github_com_mmhk_svn-admin_pkg_view.ErrorEnvelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_mmhk_svn-admin_pkg_view.ErrorEnvelope'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/github_com_mmhk_svn-admin_pkg_view.ErrorEnvelope'
        "503":
          description: setup_required
          schema:
            $ref: '#/definitions/github_com_mmhk_svn-admin_pkg_view.ErrorEnvelope'
      security:
      - bearerAuth: []
