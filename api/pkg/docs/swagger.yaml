          $ref: '#/definitions/github_com_mmhk_svn-admin_pkg_view.CreateUserRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_mmhk_svn-admin_pkg_view.User'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_mmhk_svn-admin_pkg_view.ErrorEnvelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/github_com_mmhk_svn-admin_pkg_view.ErrorEnvelope'
        "409":
          description: the account already exists
