; v3 只用環境變數 SVN_ADMIN_* 作為權威設定。
; 這個檔案是 2.0.0 的相容 fallback：只有在對應的環境變數「未設定」時，
; svn-admin 才會唯讀地取用下面三個路徑（見 api/pkg/config/legacy.go）。
; 3.0.0 不會回寫此檔；其餘 v2 專用段落（Translation / GUI / ACLManager 等）已移除。

[Subversion]
SVNAuthFile=/var/svnlocal/svn-access-file

[Repositories:svnclient]
SVNParentPath=/var/svnlocal
SvnExecutable=/usr/bin/svn
SvnAdminExecutable=/usr/bin/svnadmin

[Users:passwd]
SVNUserFile=/var/svnlocal/svn-auth-file
