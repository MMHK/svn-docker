<VirtualHost *:80>
	ServerName demo2.mixmedia.com
	ServerAdmin webmaster@localhost

	# 本 stack 只負責 SVN；/var/www 的站台不在範圍內
	DocumentRoot /var/www

	# 日誌直接進 docker logs
	ErrorLog /proc/self/fd/2
	CustomLog /proc/self/fd/1 combined

	# SVN repository (mod_dav_svn)，路徑與主機既有慣例一致
	<Location /svn>
		DAV svn
		SVNParentPath /var/svnlocal
		AuthType Basic
		AuthName "MixMedia SVN Home"
		AuthUserFile /var/svnlocal/svn-auth-file
		Require valid-user
		AuthzSVNAccessFile /var/svnlocal/svn-access-file
	</Location>

	# 靜態資源仍由 app/templates 提供（Apache Alias 以最長前綴匹配，順序不影響）
	Alias "/svnadmin/templates" "/var/www-tools/svnadmin/templates"
	<Directory "/var/www-tools/svnadmin/templates">
		Options FollowSymLinks
		AllowOverride None
		Require all granted
	</Directory>

	# iF.SVNAdmin Web GUI
	Alias "/svnadmin" "/var/www-tools/svnadmin/public"
	<Directory "/var/www-tools/svnadmin/public">
		Options FollowSymLinks
		AllowOverride All
		Require all granted
		DirectoryIndex index.php
	</Directory>
</VirtualHost>
