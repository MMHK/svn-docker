<VirtualHost *:80>
	ServerName localhost
	DocumentRoot /var/www
	ErrorLog /proc/self/fd/2
	CustomLog /proc/self/fd/1 combined

	# 唯讀煙霧測試：使用 test/real 底下的臨時帳號檔，不動正式 auth/access 檔
	<Location /svn>
		DAV svn
		SVNParentPath /var/svnlocal
		AuthType Basic
		AuthName "MixMedia SVN Home"
		AuthUserFile /test-real/svn-auth-file
		Require valid-user
		AuthzSVNAccessFile /test-real/svn-access-file
	</Location>

	Alias "/svnadmin" "/var/www-tools/svnadmin"
	<Directory "/var/www-tools/svnadmin">
		Options FollowSymLinks
		AllowOverride All
		Require all granted
	</Directory>
</VirtualHost>
