; iF.SVNAdmin 是 2013 年的程式碼，在 PHP 8 仍有 deprecation（dynamic property 等）。
; app 內 include/config.inc.php 已把 E_DEPRECATED 關掉，這裡再保險一層，不把警告印到頁面。
date.timezone = Asia/Hong_Kong
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_NOTICE

memory_limit = 256M
upload_max_filesize = 64M
post_max_size = 64M
max_execution_time = 300

session.save_path = "/tmp"
session.gc_maxlifetime = 28800
